<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Rating</title>
</head>
<body>
<p>Book Name: {{ book.title }}</p>
<p>Current Rating {{ book.rating }}</p>
<form action="{{ url_for('edit_rating', id=book.id) }}" method="post" novalidate>
    {{ form.csrf_token }}
    <p>
        {{ form.rating }} {{ form.submit }}
        {% for err in form.rating.errors + form.submit.errors + form.csrf_token.errors %}
            <span style="color: red"> {{ err }} </span>
        {% endfor %}
    </p>
</form>
</body>
</html>
